<script type="module" src="https://unpkg.com/@google/model-viewer/dist/model-viewer.min.js"></script>

<div style="max-width:900px; margin:auto; font-family: sans-serif; padding:20px;">

  <h1 style="text-align:center;">Reloj Inteligente T800</h1>
  <p style="text-align:center; color:#666;">Tócalo, gíralo y haz zoom con dos dedos</p>

  <!-- VISOR 3D INTERACTIVO -->
  <model-viewer
    src="white_mesh.glb"
    camera-controls
    touch-action="pan-y"
    auto-rotate
    rotation-per-second="20deg"
    shadow-intensity="1"
    environment-image="neutral"
    exposure="1"
    style="width:100%; height:550px; background:#f2f2f2; border-radius:24px; margin: 20px 0;">
  </model-viewer>

  <!-- TU TEXTO SIGUE NORMAL -->
  <h2>Descripción</h2>
  <p>
    Reloj con pantalla HD, resistente al agua, monitoreo de ritmo cardíaco, 
    batería de larga duración. Compatible con Android y iPhone.
  </p>

  <button style="width:100%; padding:18px; background:black; color:white; border:none; border-radius:12px; font-size:18px; margin-top:20px;">
    COMPRAR AHORA
  </button>

</div>
