<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MEMORA AEI</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  body{
    background:#000;
    color:#fff;
    font-family: 'Georgia', serif;
    min-height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    flex-direction:column;
    text-align:center;
  }
  .container{
    width:100%;
    max-width:700px;
    padding:40px 20px;
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:25px;
  }
  /* LOGO */
  .logo{
    width:120px;
    height:120px;
    object-fit:contain;
    filter: drop-shadow(0 0 15px rgba(255,255,255,0.15));
    animation: float 3s ease-in-out infinite;
  }
  @keyframes float{
    0%,100%{transform:translateY(0)}
    50%{transform:translateY(-8px)}
  }
  /* NOMBRE EMPRESA */
  h1{
    font-size:42px;
    letter-spacing:8px;
    font-weight:300;
    color:#ececec;
  }
  h1 span{
    display:block;
    font-size:12px;
    letter-spacing:6px;
    color:#c9a24b;
    margin-top:10px;
    font-family: monospace;
  }
  /* VIDEO */
  .video-box{
    width:100%;
    margin-top:10px;
    border-radius:24px;
    overflow:hidden;
    border:1px solid #ffffff15;
    box-shadow: 0 0 50px rgba(255,255,255,0.07);
    background:#0a0a0a;
  }
  video{
    width:100%;
    display:block;
  }
  p{
    color:#777;
    font-size:13px;
    letter-spacing:2px;
    font-family: monospace;
    margin-top:10px;
  }
</style>
</head>
<body>

  <div class="container">
    <!-- 1. LOGO -->
    <img src="logo.png" alt="MEMORA AEI Logo" class="logo">

    <!-- 2. NOMBRE -->
    <h1>MEMORA AEI <span>SMART TECHNOLOGY</span></h1>

    <!-- 3. VIDEO -->
    <div class="video-box">
      <video autoplay loop muted playsinline controls>
        <source src="smartwatch.mp4" type="video/mp4">
        Tu navegador no soporta video.
      </video>
    </div>

    <p>EXPLODED VIEW // AEI-01</p>
  </div>

</body>
</html>
