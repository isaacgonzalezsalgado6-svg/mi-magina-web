<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MEMORA AEI</title>
<style>
  :root {
    --bg: #050505;
    --ink: #ececec;
    --muted: #8a8a8a;
    --accent: #c9a24b;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0;
    padding: 0;
    background: var(--bg);
    color: var(--ink);
    width: 100%;
    overflow-x: hidden;
  }
  body {
    font-family: 'Georgia', 'Iowan Old Style', serif;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 6vh 6vw;
    text-align: center;
  }
  .eyebrow {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    font-size: 0.72rem;
    letter-spacing: 0.28em;
    color: var(--accent);
    margin-bottom: 1.4rem;
    font-weight: 500;
  }
  h1 {
    font-size: clamp(2.6rem, 8vw, 5.5rem);
    font-weight: 400;
    letter-spacing: 0.02em;
    margin: 0 0 0.6rem 0;
    line-height: 1.02;
  }
  h1 span {
    display: block;
    font-style: italic;
    color: var(--muted);
    font-size: 0.42em;
    margin-top: 0.5rem;
    letter-spacing: 0.05em;
  }
  .frame {
    margin-top: 4vh;
    max-width: 520px;
    width: 100%;
    border-radius: 18px;
    overflow: hidden;
    border: 1px solid rgba(201, 162, 75, 0.25);
    box-shadow: 0 0 60px rgba(201, 162, 75, 0.08);
  }
  .frame img {
    display: block;
    width: 100%;
    height: auto;
  }
  .foot {
    margin-top: 4vh;
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    font-size: 0.8rem;
    color: var(--muted);
    max-width: 420px;
    line-height: 1.6;
  }
  @media (max-width: 480px) {
    .frame { border-radius: 12px; }
  }
</style>
</head>
<body>
  <div class="eyebrow">Precisión en la muñeca</div>
  <h1>MEMORA<span>AEI</span></h1>
  <div class="frame">
    <img src="memora.gif" alt="MEMORA AEI smartwatch">
  </div>
  <div class="foot">Cada segundo, registrado. Cada dato, presente.</div>
</body>
</html>
