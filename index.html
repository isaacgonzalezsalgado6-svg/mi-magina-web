<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
<style>
html,body{margin:0;padding:0;overflow:hidden;background:black;height:100%}
canvas{position:fixed;top:0;left:0;width:100%;height:100%;touch-action:none}
#btn{
 position:fixed;top:15px;left:50%;transform:translateX(-50%);
 background:white;color:black;border:none;padding:10px 20px;
 border-radius:20px;font-weight:bold;z-index:999;
}
</style>
</head>
<body>
<button id="btn">BORRAR</button>
<canvas id="board"></canvas>

<script>
var canvas = document.getElementById("board");
var ctx = canvas.getContext("2d");
canvas.width = window.innerWidth;
canvas.height = window.innerHeight;

var painting = false;
var lastX, lastY;
var hue = 0;

function start(e){
  painting = true;
  var pos = e.touches? e.touches[0] : e;
  lastX = pos.clientX;
  lastY = pos.clientY;
}

function draw(e){
  if(!painting) return;
  e.preventDefault();
  var pos = e.touches? e.touches[0] : e;

  hue += 2;
  if(hue>360) hue=0;

  ctx.strokeStyle = "hsl("+hue+",100%,50%)";
  ctx.lineWidth = 12;
  ctx.lineCap = "round";

  ctx.beginPath();
  ctx.moveTo(lastX, lastY);
  ctx.lineTo(pos.clientX, pos.clientY);
  ctx.stroke();

  lastX = pos.clientX;
  lastY = pos.clientY;
}

function stop(){ painting = false; }

canvas.addEventListener("mousedown", start);
canvas.addEventListener("mousemove", draw);
canvas.addEventListener("mouseup", stop);
canvas.addEventListener("mouseout", stop);

canvas.addEventListener("touchstart", start, {passive:false});
canvas.addEventListener("touchmove", draw, {passive:false});
canvas.addEventListener("touchend", stop);

document.getElementById("btn").addEventListener("click", function(){
  ctx.clearRect(0,0,canvas.width,canvas.height);
});

window.addEventListener("resize", function(){
  canvas.width = window.innerWidth;
  canvas.height = window.innerHeight;
});
</script>
</body>
</html>
