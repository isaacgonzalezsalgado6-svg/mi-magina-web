<script type="module" src="https://unpkg.com/@google/model-viewer/dist/model-viewer.min.js"></script>

<model-viewer
  id="reloj"
  src="https://tmpfiles.org/dl/wSw3m95rObSi/white_mesh.glb"
  auto-rotate
  camera-controls
  auto-rotate-delay="0"
  rotation-per-second="30deg"
  shadow-intensity="1.5"
  environment-image="neutral"
  exposure="0.8"
  style="width:100%; height:700px; background-color:#0a0a0a; border-radius:24px;">
</model-viewer>

<script>
  const viewer = document.querySelector("#reloj");
  viewer.addEventListener('load', () => {
    const mat = viewer.model.materials[0];
    // Lo pintamos de negro
    mat.pbrMetallicRoughness.setBaseColorFactor([0.05, 0.05, 0.05, 1]);
    mat.pbrMetallicRoughness.setMetallicFactor(0.8);
    mat.pbrMetallicRoughness.setRoughnessFactor(0.25);
  });
</script>
