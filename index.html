<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Me Jalo - Player</title>
<style>
body{margin:0;height:100vh;background:linear-gradient(135deg,#0f0c29,#302b63,#ff4d6d);display:flex;justify-content:center;align-items:center;font-family:Arial}
.player{background:white;width:320px;padding:30px;border-radius:25px;text-align:center;box-shadow:0 15px 40px rgba(0,0,0,.4)}
.cover{width:180px;height:180px;background:linear-gradient(135deg,#ff4d6d,#302b63);border-radius:50%;margin:0 auto 20px;display:flex;justify-content:center;align-items:center;font-size:80px;animation:spin 3s linear infinite paused}
.cover.playing{animation-play-state:running}
@keyframes spin{to{transform:rotate(360deg)}}
h2{margin:10px 0 5px}
p{opacity:.6;margin:0 0 15px}
input{display:none}
label{background:#ff4d6d;color:white;padding:10px 20px;border-radius:20px;cursor:pointer;display:inline-block;margin:10px;font-weight:bold}
audio{width:100%;margin-top:15px}
.btn{width:60px;height:60px;border:none;border-radius:50%;background:#0f0c29;color:white;font-size:28px;cursor:pointer;margin:10px}
</style>
</head>
<body>
<div class="player">
<div class="cover" id="cover">🎵</div>
<h2>Me Jalo</h2>
<p>Tu reproductor</p>

<label for="file">📁 Subir tu música MP3</label>
<input type="file" id="file" accept="audio/*">

<audio id="audio" controls></audio>
<br>
<button class="btn" onclick="audio.play()">▶️</button>
<button class="btn" onclick="audio.pause()">⏸️</button>
</div>

<script>
const fileInput = document.getElementById('file');
const audio = document.getElementById('audio');
const cover = document.getElementById('cover');

fileInput.onchange = function(){
  const file = this.files[0];
  if(file){
    audio.src = URL.createObjectURL(file);
    audio.play();
    cover.textContent = "💿";
  }
};

audio.onplay = ()=> cover.classList.add('playing');
audio.onpause = ()=> cover.classList.remove('playing');
</script>
</body>
</html>
