<model-viewer
  id="reloj"
  src="white_mesh%202.glb"
  camera-controls
  auto-rotate
  shadow-intensity="1.2"
  environment-image="neutral"
  exposure="0.8"
  style="width:100%; height:600px; background:#1a1a1a; border-radius:20px;">
</model-viewer>

<script>
  const reloj = document.querySelector("#reloj");
  reloj.addEventListener('load', () => {
    const m = reloj.model.materials[0];
    m.pbrMetallicRoughness.setBaseColorFactor([0.08, 0.08, 0.08, 1]);
    m.pbrMetallicRoughness.setMetallicFactor(0.7);
    m.pbrMetallicRoughness.setRoughnessFactor(0.3);
  });
</script>
