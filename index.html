<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Te Amo en 100 Idiomas</title>
<style>
  body{
    margin:0;
    height:100vh;
    background: radial-gradient(circle at center, #ff1a4d, #000);
    display:flex;
    justify-content:center;
    align-items:center;
    font-family: 'Segoe UI', sans-serif;
    overflow:hidden;
    color:white;
  }
 .card{
    text-align:center;
    animation: flotar 3s ease-in-out infinite;
  }
  @keyframes flotar{
    0%,100%{transform:translateY(0)}
    50%{transform:translateY(-15px)}
  }
  #idioma{
    font-size:20px;
    opacity:0.7;
    letter-spacing:3px;
    text-transform:uppercase;
  }
  #frase{
    font-size: clamp(40px, 10vw, 80px);
    font-weight:900;
    margin:15px 0;
    text-shadow: 0 0 30px rgba(255,255,255,0.7);
  }
  #corazon{
    font-size:50px;
    animation: latir 0.8s infinite;
  }
  @keyframes latir{
    0%{transform:scale(1)}
    50%{transform:scale(1.3)}
    100%{transform:scale(1)}
  }
</style>
</head>
<body>

<div class="card">
  <div id="idioma">Español</div>
  <div id="frase">Te amo</div>
  <div id="corazon">❤️</div>
</div>

const idiomaEl = document.getElementById('idioma');
const fraseEl = document.getElementById('frase');

function cambiar(){
  idiomaEl.textContent = lista[i][0];
  fraseEl.textContent = lista[i][1];
  i = (i + 1) % lista.length;
}

// VELOCIDAD: 1200 = lento bonito, 700 = medio, 400 = rápido
setInterval(cambiar, 1200);
