<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Reloj T800</title>
<script type="module" src="https://unpkg.com/@google/model-viewer/dist/model-viewer.min.js"></script>
<style>
  html,body{margin:0;height:100%;background:#c2c2c2;}
  model-viewer{width:100%;height:100vh;background:#c2c2c2;}
</style>
</head>
<body>

<model-viewer
  id="reloj"
  src="white_mesh%202.glb"
  poster="reloj_hero.jpg"
  camera-controls
  touch-action="pan-y"
  auto-rotate
  auto-rotate-delay="0"
  rotation-per-second="25deg"
  shadow-intensity="1.5"
  shadow-softness="1"
  environment-image="neutral"
  exposure="0.7"
  camera-orbit="0deg 75deg 2.5m"
  min-camera-orbit="auto auto 1m"
  max-camera-orbit="auto auto 6m"
  field-of-view="22deg"
  alt="Reloj T800">
</model-viewer>

<script>
  const reloj = document.getElementById('reloj');
  reloj.addEventListener('load', () => {
    reloj.model.materials.forEach(m=>{
      m.pbrMetallicRoughness.setBaseColorFactor([0.06,0.06,0.07,1]);
      m.pbrMetallicRoughness.setMetallicFactor(0.8);
      m.pbrMetallicRoughness.setRoughnessFactor(0.25);
    });
  });
</script>

</body>
</html>
